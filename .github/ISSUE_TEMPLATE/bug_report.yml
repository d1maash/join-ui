name: Bug report
description: Something in a component, the registry or the docs site is broken.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please check the existing issues first — a
        duplicate costs you the same effort and helps nobody.

  - type: input
    id: component
    attributes:
      label: Component
      description: The slug of the affected component, or `site` / `registry` / `docs`.
      placeholder: focus-stack
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: |
        A minimal reproduction — a StackBlitz, a CodeSandbox or a small repo —
        gets a fix far faster than a description alone.
      placeholder: |
        1. Install with `pnpm dlx shadcn@latest add @joinui/focus-stack`
        2. Render it inside …
        3. Press Tab twice
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Output of `npx envinfo --system --browsers --npmPackages next,react,tailwindcss,motion`
      render: text
    validations:
      required: true

  - type: checkboxes
    id: conditions
    attributes:
      label: Conditions
      options:
        - label: It also happens with Reduce Motion disabled
        - label: It also happens in a project with no custom token overrides
        - label: I am on the latest version of the component (re-ran the CLI)

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's [Code of Conduct](https://github.com/d1maash/join-ui/blob/main/CODE_OF_CONDUCT.md)
          required: true
